name: Auto Generate IPTV List
on:
  schedule:
    # UTC 时间，0 22 * * * = 北京时间 06:00
    - cron: '0 22 * * *'
  workflow_dispatch: # 手动触发按钮

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run iptv-api generate
        run: npm run start

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # iptv-api 默认输出目录 output，上传这个目录内容到GH Pages
          path: ./output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
